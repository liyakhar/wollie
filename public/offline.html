<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wollie</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#fbfbf9;color:#111;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;display:grid;place-items:center;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) 24px;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:28rem}
.mark{width:4.5rem;height:4.5rem;border-radius:18px;background:#cdea3a;border:1px solid rgba(17,17,17,.1);display:grid;place-items:center;margin-bottom:1.5rem;font:400 2rem Georgia,serif}
h1{font:400 2.75rem/1 Georgia,"Times New Roman",serif;letter-spacing:-.03em;margin-bottom:.9rem}
p{color:rgba(17,17,17,.62);margin-bottom:1.75rem}
button{width:100%;min-height:3.25rem;border:0;border-radius:14px;background:#111;color:#fbfbf9;font:600 1rem -apple-system,sans-serif}
button:active{opacity:.8}
</style></head><body><main>
<div class="mark" aria-hidden="true">W</div>
<h1>No connection.</h1>
<p>Wollie could not load. Check your internet, then try again. Your data is safe.</p>
<button type="button" onclick="location.href='/app'">Try again</button>
</main></body></html>
