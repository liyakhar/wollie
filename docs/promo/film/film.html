<style>

<script>
const W=1920,H=1080;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=x=>1-Math.pow(1-x,3);
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

function spring(t,t0,z=.52,w=16){const s=t-t0;if(s<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*s)*(Math.cos(wd*s)+(z*w/wd)*Math.sin(wd*s))}

function key(t,cx,cy,w,h,r){K.push([t,cx,cy,w,h,r])}
function blobAt(t){
  let a=K[0],b=K[K.length-1];

  for(let i=0;i<K.length-1;i++){if(t>=K[i][0]&&t<=K[i+1][0]){a=K[i];b=K[i+1];break}}

   <svg id="fid" viewBox="0 0 200 200" style="position:absolute;width:210px;height:210px;overflow:visible" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
     <path id="fc" d="M20 70V45a25 25 0 0 1 25-25h25M130 20h25a25 25 0 0 1 25 25v25M180 130v25a25 25 0 0 1-25 25h-25M70 180H45a25 25 0 0 1-25-25v-25"/>
     <path id="fe" d="M72 78v18M128 78v18M100 84v26h-8M68 134c18 16 46 16 64 0"/>
     <path id="fk" d="M64 104l24 24 50-54" stroke="#111" stroke-width="12"/></svg>
   <div id="bars" style="position:absolute;left:0;top:0"></div>`;

  const rows=[['Groceries','€353 left of €400',.88,false],['Transport','€21.50 over',1,true],['Travel','€200 to save',.42,false]];

  $('left1').style.cssText='left:120px;top:330px;height:280px;width:760px';
  $('cta').style.cssText='left:0;width:1920px;top:'+(H/2+190)+'px;height:70px;text-align:center';
  $('ctai').style.cssText+=';position:absolute;left:0;right:0;top:0';
  const sp2=$('sp').getBoundingClientRect();

  K.forEach(k=>{if(k[0]===17.45||k[0]===18.0){k[1]=spRect.cx;k[2]=spRect.cy;k[3]=spRect.w;k[4]=spRect.h;k[5]=0}});
}
function fmt(v){const s=v.toFixed(2).split('.');return '€'+Number(s[0]).toLocaleString('en')+'<span style="font-size:.5em;opacity:.5;font-family:IS">.'+s[1]+'</span>'}
const CUR=[[3.3,1900,980,0],[3.9,1330,700,1],[4.6,1290,640,1],[5.4,1330,760,1],[6.2,1330,700,1],[8.0,1370,610,1],[8.75,1372,606,1],[8.95,1372,606,1],[9.4,1380,640,0]];
function curAt(t){

function setRect(el,cx,cy,w,h,r){el.style.left=(cx-w/2)+'px';el.style.top=(cy-h/2)+'px';el.style.width=w+'px';el.style.height=h+'px';el.style.borderRadius=Math.min(r,w/2,h/2)+'px'}
function riseMask(inner,t,t0,d=.45){const k=eOut(seg(t,t0,t0+d));inner.style.transform=`translateY(${(1-k)*105}%)`}

  const click=1-0.2*(Math.exp(-Math.pow((t-8.8)/.08,2)))-0.0;
  cu.style.transform=`translate(${c[0]}px,${c[1]}px) scale(${c[2]*click})`;
  cu.style.display=c[2]>0.01?'block':'none';
}
window.__ready=false;
document.fonts.ready.then(()=>{build();window.seek=seek;window.__ready=true;seek(0);});
</script></body></html>
