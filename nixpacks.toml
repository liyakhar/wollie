[phases.setup]
# Pin nixpkgs for Node 22.13.1 — Prisma 7 needs Node >=22.12
nixpkgsArchive = "51ad838b03a05b1de6f9f2a0fffecee64a9788ee"
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
# Build tools (vite) are devDependencies; install them even when NODE_ENV=production.
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
cmds = [
  "pnpm exec prisma generate",
  "pnpm run build"
]

[start]
cmd = "pnpm run start"
